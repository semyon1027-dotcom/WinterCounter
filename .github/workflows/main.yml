name: Build Winter Counter Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "fix/**"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }} for GD 2.2091 / Geode 6.0.0
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [Android32, Android64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Winter Counter sources
        shell: bash
        run: |
          rm -rf /tmp/winter
          mkdir -p /tmp/winter
          unzip -q WinterCounter-Geode6-GD22091-Android-fixed.zip -d /tmp/winter

      - name: Apply Geode 6 asp::fs compatibility fixes
        shell: bash
        run: bash patches/apply-geode6-asp-fs.sh /tmp/winter/WinterCounter

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          sdk: given
          android-min-sdk: "23"
          android-ndk-version: "29.0.14206865"
          path: /tmp/winter/WinterCounter
          combine: true

  package:
    name: Package Android .geode files
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Combine Android packages
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Upload Winter Counter
        uses: actions/upload-artifact@v4
        with:
          name: WinterCounter-Android-GD-2.2091-Geode-6.0.0
          path: ${{ steps.combine.outputs.build-output }}
          if-no-files-found: error
